<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оформление заказа — Oh My Smell</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f3ee;
      color: #1c1712;
    }

    .checkout {
      max-width: 560px;
      margin: 60px auto;
      padding: 32px;
      background: white;
      border: 1px solid #d8c7b0;
    }

    h1 {
      margin-top: 0;
      font-weight: 400;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #c9b79f;
      font-size: 16px;
      box-sizing: border-box;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      background: #1c1712;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #3a3028;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 24px;
      color: #7a5a2e;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="checkout">
    <a href="index.html" class="back-link">← Вернуться в магазин</a>

    <h1>Оформление заказа</h1>

    <form id="checkoutForm">
      <div class="field">
        <label for="customerName">Имя</label>
        <input
          id="customerName"
          name="customerName"
          type="text"
          required
        >
      </div>

      <div class="field">
        <label for="phone">Телефон</label>
        <input
          id="phone"
          name="phone"
          type="tel"
          required
        >
      </div>

      <div class="field">
        <label for="telegram">Telegram</label>
        <input
          id="telegram"
          name="telegram"
          type="text"
          placeholder="@username"
        >
      </div>

      <div class="field">
        <label for="comment">Комментарий</label>
        <textarea
          id="comment"
          name="comment"
          placeholder="Доставка, удобное время, пожелания"
        ></textarea>
      </div>

      <button type="submit">Подтвердить заказ</button>
    </form>
  </main>
</body>
</html>
