<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оформление заказа — Oh My Smell</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f3ee;
      color: #1c1712;
    }

    .checkout {
      max-width: 560px;
      margin: 60px auto;
      padding: 32px;
      background: white;
      border: 1px solid #d8c7b0;
    }

    h1 {
      margin-top: 0;
      font-weight: 400;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #c9b79f;
      font-size: 16px;
      box-sizing: border-box;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      background: #1c1712;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #3a3028;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 24px;
      color: #7a5a2e;
      text-decoration: none;
    }
    .order-summary {
  margin-bottom: 30px;
  padding: 20px;
  border: 1px solid #d8c7b0;
  background: #faf8f5;
}

.order-summary h2 {
  margin-top: 0;
  font-size: 20px;
  font-weight: 500;
}

.checkout-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid #e8e0d5;
}

.checkout-item:last-child {
  border-bottom: none;
}

.checkout-total {
  margin-top: 18px;
  font-size: 20px;
  font-weight: bold;
}
  </style>
</head>

<body>
  <main class="checkout">
    <a href="index.html" class="back-link">← Вернуться в магазин</a>

    <h1>Оформление заказа</h1>
<div class="order-summary">
    <h2>Ваш заказ</h2>

    <div id="checkout-items"></div>

    <div class="checkout-total">
        Итого:
        <span id="checkout-total">0 ₽</span>
    </div>
</div>
    <form id="checkoutForm">
      <div class="field">
        <label for="customerName">Имя</label>
        <input
          id="customerName"
          name="customerName"
          type="text"
          required
        >
      </div>

      <div class="field">
        <label for="phone">Телефон</label>
        <input
          id="phone"
          name="phone"
          type="tel"
          required
        >
      </div>

      <div class="field">
        <label for="telegram">Telegram</label>
        <input
          id="telegram"
          name="telegram"
          type="text"
          placeholder="@username"
        >
      </div>

      <div class="field">
        <label for="comment">Комментарий</label>
        <textarea
          id="comment"
          name="comment"
          placeholder="Доставка, удобное время, пожелания"
        ></textarea>
      </div>

      <button type="submit">Подтвердить заказ</button>
    </form>
  </main>
  <script>
const cart = JSON.parse(localStorage.getItem("ohmysmell_cart") || "[]");

const itemsContainer = document.getElementById("checkout-items");
const totalElement = document.getElementById("checkout-total");

function formatPrice(price) {
    return new Intl.NumberFormat("ru-RU").format(price) + " ₽";
}

function renderCheckout() {

    if (cart.length === 0) {
        itemsContainer.innerHTML = "<p>Корзина пуста.</p>";
        return;
    }

    let total = 0;

    cart.forEach(item => {

        const qty = item.qty || item.quantity || 1;
        const sum = item.price * qty;

        total += sum;

        itemsContainer.innerHTML += `
            <div class="checkout-item">
                <div>
                    <strong>${item.brand}</strong><br>
                    ${item.name}<br>
                    ${qty} × ${formatPrice(item.price)}
                </div>

                <strong>${formatPrice(sum)}</strong>
            </div>
        `;
    });

    totalElement.textContent = formatPrice(total);
}

renderCheckout();
const ORDER_API_URL = "https://ohmysmell-backend-production.up.railway.app/orders";

const checkoutForm = document.getElementById("checkoutForm");

checkoutForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    if (cart.length === 0) {
        alert("Корзина пуста.");
        return;
    }

    const orderData = {
        customer_name: document.getElementById("customerName").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        telegram: document.getElementById("telegram").value.trim() || null,
        comment: document.getElementById("comment").value.trim() || null,
        items: cart.map(item => ({
            id: item.id,
            qty: item.qty || item.quantity || 1
        }))
    };

    console.log("Отправляем заказ:", orderData);

    try {
        const response = await fetch(ORDER_API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(orderData)
        });

        const data = await response.json();

        console.log("Ответ backend:", data);

        if (!response.ok) {
            console.error("Ошибка backend:", data);
            alert("Не удалось оформить заказ.");
            return;
        }

        alert("Заказ успешно отправлен!");

    } catch (error) {
        console.error("Ошибка отправки заказа:", error);
        alert("Не удалось связаться с сервером.");
    }
});
</script>
</body>
</html>
